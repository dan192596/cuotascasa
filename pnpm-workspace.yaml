packages:
  - apps/web
  - packages/*
  - tools/conformance
  - e2e

# Dependency lifecycle scripts are blocked (.npmrc strict-dep-builds=true). Only these may run:
onlyBuiltDependencies:
  - lefthook

# Reviewed and not needed: these packages work from their prebuilt optional binaries.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - lmdb
  - msgpackr-extract
  - unrs-resolver
  - workerd

