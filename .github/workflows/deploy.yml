# Deploy to Cloudflare Workers static assets (W3-17, ADR-0002, ADR-0022). After W0, .github/ is edited only by W2-01,
# W3-16 and W3-17 (docs/plan/frozen-files.json). Same conventions as ci.yml: actions pinned to full commit SHAs (tag in
# the comment), read-only token, no persisted credentials.
#
# Dormant until the owner configures it: the job runs only when the repository variable DEPLOY_ENABLED is 'true'
# (environment variables are not visible to a job-level `if`, so this one must be a repository variable).
# Owner configuration (no value is ever committed, ADR-0015 §9):
#   repository variable      DEPLOY_ENABLED = 'true'
#   environment `production` (required reviewer), secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   environment `production` (or repository) variables:      GOOGLE_CLIENT_ID, SITE_HOST (bare host, e.g. app.<domain>)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer successful CI run queues behind the running deploy instead of cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Only a successful CI run for a push to main of this repository (never a pull_request run whose head branch is
    # also called main, e.g. from a fork). ci.yml cancels superseded runs on main, so a cancelled commit is skipped
    # and the next successful one deploys (W3-17 note D29).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.SITE_HOST }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout the commit CI verified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node 24 with the pnpm store cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Validate the deploy configuration
        # Values reach the shell only through env (never interpolated into the script). The client ID may be empty:
        # the site then deploys with Drive 'no configurado' (ADR-0008 decision 6), which is how the first deploy runs
        # before the Google Cloud guide (docs/guides/google-cloud-setup.md) can verify the published domain.
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          if ! printf '%s' "$SITE_HOST" | grep -Eq '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'; then
            echo "::error title=deploy::SITE_HOST must be a bare lowercase host name (no scheme, path or port)"
            exit 1
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -Eq '^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$'; then
            echo "::error title=deploy::GOOGLE_CLIENT_ID is not a Google OAuth web client ID"
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning title=deploy::GOOGLE_CLIENT_ID is empty: Drive will show 'no configurado'"
          fi
      - name: The build below mirrors the package.json build script
        run: |
          node -e "const s=JSON.parse(require('node:fs').readFileSync('package.json','utf8')).scripts.build;if(s!=='ng build && node tools/edge/headers/generate.mjs'){console.error('package.json build changed: update deploy.yml ('+s+')');process.exit(1)}"
      - name: Build with the build-time defines (ADR-0015 §9), then the post-build header step (ADR-0021)
        # Same as `pnpm build`, plus --define. The defines replace only these keys of angular.json's `define`; nothing
        # is mutated after `ng build`, so the ngsw.json hashes stay valid (checked by the dist tests below).
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
        run: |
          pnpm exec ng build \
            --define "GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID'" \
            --define "REPOSITORY_ISSUES_URL='$ISSUES_URL'"
          node tools/edge/headers/generate.mjs
      - name: Build output tests, with the injected values expected
        env:
          EXPECTED_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          EXPECTED_REPOSITORY_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
        run: pnpm exec ng test --configuration=dist --no-watch
      - name: Bundle composition and landing budget (W2-12)
        run: pnpm bundle:check
      - name: Edge routing and per-route headers behind local wrangler (ADR-0022, ADR-0021)
        run: pnpm edge:check
      - name: Deploy to Cloudflare (assets-only Worker on the custom domain)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: pnpm exec wrangler deploy --domain "$SITE_HOST" --message "CI $HEAD_SHA"
      - name: Edge routing and headers against the live site (ADR-0022, ADR-0021)
        # A new version and a new custom domain take a moment to propagate: retry a few times before failing.
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm edge:check --base-url "https://$SITE_HOST" && exit 0
            echo "live edge:check attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
