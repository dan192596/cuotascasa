# CI (W0-06). After W0, .github/ is edited only by W2-01, W3-16 and W3-17 (docs/plan/frozen-files.json).
# Actions are pinned to full commit SHAs (tag in the comment); Renovate (W1-10) proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (full history, needed by owns-check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node 24 with the pnpm store cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Dependency policy
        run: pnpm catalog:check
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck && pnpm exec tsc -p tools/lint-fixtures/tsconfig.json
      - name: Playwright browsers for Vitest browser projects (Chromium and WebKit)
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Angular unit tests
        run: pnpm run test:web
      - name: Lint-boundary proofs (ADR-0010 §5)
        run: pnpm exec vitest run --config tools/lint-fixtures/vitest.config.ts
      - name: Build
        run: pnpm build
      - name: Build output tests
        run: pnpm exec ng test --configuration=dist --no-watch
      - name: owns-check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: node tools/owns-check/check.mjs --base "origin/$BASE_REF" --branch "$HEAD_REF"
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks over the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .'

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python (tools/oracle/.python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: tools/oracle/.python-version
      - name: Plan views up to date (cards.json and frozen-files.json included)
        run: python tools/plan/render_plan.py --check
      - name: Plan generator tests
        run: python -m unittest discover -s tools/plan -p 'test_*.py' -v
      - name: Algorithm examples (INDEX.md, «Reglas de validación»)
        run: python .github/scripts/check_algorithm_examples.py . all
      - name: Algorithm examples checker tests and CODEOWNERS coverage
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
